# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      all-non-major:
        update-types:
          - "minor"
          - "patch"
      # React's runtime packages live in `dependencies` while their type
      # packages live in `devDependencies`. Left ungrouped, Dependabot splits
      # them into separate PRs, and each one fails alone on peer resolution:
      # bumping react to 19 needs @types/react@19, but the branch still carries
      # @types/react-dom@18, which peers on @types/react@^18. Grouping the four
      # together is what makes a React major landable in one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Bumps the `uses:` pins in .github/workflows/ so the forks and actions
  # pinned there do not rot silently. Without this, a pinned workflow ref
  # sits still until something breaks.
  #
  # Merge path: GitHub's NATIVE auto-merge, armed by
  # `dependabot-auto-merge.yml` (which also excludes these PRs from its own
  # polling path, because github_actions has no dependable fetch-metadata
  # update-type). Native auto-merge completes only once the branch's required
  # status checks pass, and `main` is protected — so this cannot land a red
  # build.
  #
  # `auto-merge` is NOT a valid key here (verified against the full Dependabot
  # options reference), and `gh pr merge --auto` merges immediately when the
  # base branch has NO required checks — which is precisely why `main` is
  # protected and why that protection is load-bearing for this path. Do not
  # disable it without also removing the native auto-merge step.
  #
  # Majors are ignored below, so only patch/minor updates arrive.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Majors on a workflow ref usually need code changes (upstream breaking
      # changes), so they must be deliberate. Dependabot's own `update-types`
      # vocabulary is the place to express this — not guesswork about what
      # `fetch-metadata` reports for github_actions.
      #
      # Trade-off: this also suppresses *security* updates for a major, so the
      # pinned fork/actions will not auto-patch across a major boundary. Check
      # `gh api repos/OWNER/REPO/releases` periodically, or drop this block and
      # merge majors by hand when they appear.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions:
        patterns:
          - "*"
