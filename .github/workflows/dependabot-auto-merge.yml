# Dependabot auto-merge.
#
# Two ecosystems, two paths — they must stay mutually exclusive:
#
#   npm            -> the polling step below merges patch + minor once CI is green.
#   github-actions -> that polling step is explicitly EXCLUDED (see its `if:`),
#                     because github_actions carries no dependable
#                     `fetch-metadata` update-type (verified: the string
#                     "github_actions" appears nowhere in fetch-metadata's
#                     source or tests). Instead we hand the PR to GitHub's
#                     native auto-merge, which completes only once the branch's
#                     required status checks pass. Majors never reach either
#                     path — dependabot.yml `ignore`s them at the source.
#
# Why this does NOT use `gh pr checks --watch` for the npm path:
#
#   `gh pr checks` lists EVERY check on the PR — including this job's own
#   check-run ("auto-merge"). `--watch` therefore waits for a check that can
#   only conclude when this job ends: a self-deadlock that burns the job's
#   entire time budget. Verified in run 37582675348, where the polling output
#   inside the merge step contains `auto-merge  pending  0` — its own check.
#
#   `--fail-fast` made it worse: any non-code check that is not `pass` (e.g.
#   CodeRabbit's review state) aborts the merge.
#
# Instead, poll only the checks that gate correctness — build, lint, test —
# and ignore everything else on the PR.
#
# History this replaces: the old version only ever got as far as running its
# merge step on days when CI was already red (2026-10-04, 10-06, 10-07), so
# the deadlock was masked by a real failure. No Dependabot PR has ever been
# merged by a bot — every one was merged by hand.

name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Bound the job. Without this a stuck wait runs to GitHub's 6-hour default
    # and burns runner minutes silently.
    timeout-minutes: 25
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # github-actions bumps: no polling. Native auto-merge waits on the
      # branch's required status checks itself, so this cannot land a red
      # build — and it cannot self-deadlock, because GitHub evaluates the
      # required checks rather than this job's own check-run.
      #
      # `allow_auto_merge` must be enabled on the repository for this to work;
      # `gh pr merge --auto` errors if it is not.
      #
      # Caveat worth knowing: the required checks (build, lint, test) exercise
      # ci.yml only. A bump to a pin used solely by release.yml or issue-bot.yml
      # is therefore not covered by them, and would land unverified.
      - name: Enable auto-merge for github-actions bumps
        if: steps.metadata.outputs.package-ecosystem == 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail
          gh pr merge --squash --auto "$PR_URL"

      - name: Merge patch + minor updates once CI is green
        if: >
          steps.metadata.outputs.package-ecosystem != 'github_actions' &&
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -uo pipefail

          # The CI jobs that gate correctness, by name. Keep in sync with
          # .github/workflows/ci.yml. Anything not listed (CodeRabbit, this
          # job's own check) is ignored on purpose.
          REQUIRED='["build","lint","test"]'

          deadline=$(( SECONDS + 1200 ))   # 20 min, inside the 25 min job cap

          while :; do
            # `gh pr checks` exits non-zero while checks are pending (8) or
            # failing (1), so the substitution must not kill the script.
            json=$(gh pr checks "$PR_URL" --json name,state 2>/dev/null) || true

            if [ -z "$json" ] || [ "$json" = "[]" ]; then
              echo "No checks reported yet; waiting…"
            else
              seen=$(jq --argjson req "$REQUIRED" \
                '[.[] | select(.name as $n | $req | index($n))] | length' <<<"$json")

              failed=$(jq --argjson req "$REQUIRED" \
                '[.[] | select(.name as $n | $req | index($n))
                     | select(.state == "FAILURE" or .state == "ERROR"
                              or .state == "CANCELLED"
                              or .state == "TIMED_OUT")] | length' <<<"$json")

              pending=$(jq --argjson req "$REQUIRED" \
                '[.[] | select(.name as $n | $req | index($n))
                     | select(.state == "PENDING" or .state == "QUEUED"
                              or .state == "IN_PROGRESS"
                              or .state == "EXPECTED" or .state == "WAITING")] | length' <<<"$json")

              if [ "$failed" -gt 0 ]; then
                echo "CI is red on this head — not merging."
                gh pr comment "$PR_URL" --body \
                  "Auto-merge held: CI is not green on this head. Review before merging."
                exit 0
              fi

              # All three required checks seen and none still running.
              if [ "$seen" -ge 3 ] && [ "$pending" -eq 0 ]; then
                echo "CI green — merging."
                gh pr merge --squash --delete-branch "$PR_URL"
                exit 0
              fi
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for CI — leaving the PR for a human."
              gh pr comment "$PR_URL" --body \
                "Auto-merge gave up waiting for CI (>20 min). Merge by hand, or re-run CI."
              exit 0
            fi

            sleep 15
          done

      - name: Comment on major updates (manual review required)
        if: >
          steps.metadata.outputs.package-ecosystem != 'github_actions' &&
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — auto-merge skipped. Review the changelog before merging."
