name: Release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    uses: techne-tools/zotero-plugin-workflows/.github/workflows/release-plugin.yml@v1.1.0-techne.1
    # You can customize any of the inputs here.
    # If you omit an input, its default value will be used.
    with:
      build: "npm run build"
      release: "npm run release"
    secrets: inherit
